name: CD Pipeline

on:
  workflow_dispatch:
  # Automatically run the workflow on any pushed tag
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            installer_glob: |
              out/make/**/*.deb
              out/make/**/*.rpm
          - os: windows-latest
            platform: windows
            installer_glob: out/make/squirrel.windows/**/*.exe
          - os: macos-latest
            platform: mac
            installer_glob: out/make/**/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Clean previous build output (Unix)
        if: runner.os != 'Windows'
        run: rm -rf build dist out

      - name: Clean previous build output (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          REM Check if directories exist before removing them, otherwise Windows build throws an error
          if exist build rd /s /q build
          if exist dist rd /s /q dist
          if exist out rd /s /q out

      - name: Sync Python dependencies
        run: uv sync

      - name: Package Python (Unix)
        if: runner.os != 'Windows'
        run: npm run package-py-unix

      - name: Package Python (Windows)
        if: runner.os == 'Windows'
        run: npm run package-py-win

      - name: Install npm packages
        run: npm install

      - name: Build Tailwind CSS
        run: npm run tailwind

      - name: Package the application
        run: npm run make

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: team-9-project-${{ matrix.platform }}
          path: ${{ matrix.installer_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
