{% extends "base.html" %}

<!-- Page title -->
{% block title %}
  Home
{% endblock %}

<!-- Available systems -->
{% block content %}
  {% for system in systems %}
    <a  
      id="{{ system.name }}"
      class="system-path-button"
      href="/simulation/{{ system.name }}"
    >
      {{ system.name }}
    </a>
  {% endfor %}
{% endblock %}

<!-- Scripts block -->
{% block scripts %}
  <script src="/src/ui/script.js"></script>
{% endblock %}
