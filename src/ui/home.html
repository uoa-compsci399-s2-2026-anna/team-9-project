{% from "components/logo.html" import logo %}
{% extends "base.html" %}

<!-- Page title -->
{% block title %}Home{% endblock %}
{% block content %}
  <!-- Absolute positioning to position relative to parent -->
  <div class="absolute h-full w-full">
    <!-- Center content div -->
    <div class="flex h-full w-full items-center justify-center">
      <!-- Content div -->
      <div class="flex flex-col items-start justify-center">
        <!-- Main OPIS logo -->
        <div class="flex w-55 self-start pt-0.5">
          {% include "components/logo.html" %}
        </div>

        <!-- Available systems -->
        <div class="mx-auto mt-18 w-fit">
          <p class="text-secondary mb-7 italic">Select a simulation</p>
          <div
            class="grid grid-cols-1 justify-items-center gap-6 sm:grid-cols-2 lg:grid-cols-3"
          >
            {% for system in systems %}
              <a
                id="{{ system.name }}"
                class="system-path-button control bordered-light clickable shadowed flex h-35 w-55 grid-flow-col flex-col items-center justify-center gap-2 text-xl font-semibold"
                href="/simulation/{{ system.name }}"
              >
                {{ system.name }}
              </a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

<!-- Scripts block -->
{% block scripts %}
  <script
    type="module"
    src="/src/events/triggers/sharedTriggers.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/events/triggers/settingsTriggers.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/controllers/settingsController.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/events/triggers/homeTriggers.js"
    defer
  ></script>
  <script type="module" src="/src/ui/toolbar.js" defer></script>
{% endblock %}
