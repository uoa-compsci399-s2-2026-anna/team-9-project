<!doctype html>
<html lang="en" data-theme="dark" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/output.css" rel="stylesheet" />
    <title>Home</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div
      class="flex h-screen flex-col bg-white bg-cover bg-center fill-zinc-900 text-zinc-900 dark:bg-zinc-900 dark:fill-white dark:text-white"
    >
      <!-- Navigation bar -->
      <nav class="z-30 flex flex-wrap items-start justify-between gap-4 p-6">
        <!-- Hidden content to maintain consistent toolbar position -->
        <div style="visibility: hidden">
          <button id="opis-button" class="self-center max-sm:hidden">
            <svg
              viewBox="0 0 150 166.27"

              <path
                d="M128.11,42.14c-13.86-12.43-28-14.88-43.6-14.88a94.57,94.57,0,0,0-16.35,1.36L77.51,0,50.56,27.16,15.1,15.57,41.85,42.11l-11.41,35L56.33,51,92.07,62.71l-24.13-24a31.27,31.27,0,0,1,14.41-2.6c15.82,0,39.37,22.61,32.83,63.86-2.44,15.44-15.31,57.45-50.15,57.45-15.22,0-39.27-16.25-33.51-61.57-7,12.48-16.2,19.8-24.71,18.22A13.87,13.87,0,0,1,0,110.54C.13,131.7,9.61,147.2,19.79,154c13.42,9.22,29.33,12.24,42.33,12.24,29.76,0,47.56-11.3,62.22-26.56,11.88-13.18,18.48-27.5,20.65-41.25C149.11,72.47,140.63,53.44,128.11,42.14Z"
              />
            </svg>
          </button>

          <!-- System information -->
          <button
            id="system-information-button"
            class="items-center rounded-md p-2 text-left opacity-100 transition-opacity duration-200 ease-in-out hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
          >
            <hgroup class="max-sm:hidden">
              <span class="flex items-center">
                <h1 class="pr-2 text-3xl font-bold">Solar System</h1>

                <!-- Dropdown chevron -->
                <svg class="size-7" viewBox="0 0 24 24">
                  <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                  <path
                    d="M11.475 14.475L7.85 10.85q-.075-.075-.112-.162T7.7 10.5q0-.2.138-.35T8.2 10h7.6q.225 0 .363.15t.137.35q0 .05-.15.35l-3.625 3.625q-.125.125-.25.175T12 14.7t-.275-.05t-.25-.175"
                  />
                </svg>
              </span>
              <p class="text-s italic dark:text-zinc-400">8 planets</p>
            </hgroup>
          </button>
        </div>

        <div class="grow"></div>

        <div class="flex gap-4">
          <!-- Help button -->
          <div class="group relative inline-block">
            <button
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"

            >
              Help
            </div>
          </div>

          <!-- Light/dark mode button -->
          <div class="group relative inline-block">
            <button
              id="dark-mode-toggle-button"
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"

            <!-- Tooltip -->
            <div
              class="pointer-events-none absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              View in dark mode
            </div>
          </div>

          <!-- Settings button -->
          <div class="group relative inline-block">
            <button
              id="settings-button"
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">

                <path
                  d="M19.5 12c0-.23-.01-.45-.03-.68l1.86-1.41c.4-.3.51-.86.26-1.3l-1.87-3.23a.987.987 0 0 0-1.25-.42l-2.15.91c-.37-.26-.76-.49-1.17-.68l-.29-2.31c-.06-.5-.49-.88-.99-.88h-3.73c-.51 0-.94.38-1 .88l-.29 2.31c-.41.19-.8.42-1.17.68l-2.15-.91c-.46-.2-1-.02-1.25.42L2.41 8.62c-.25.44-.14.99.26 1.3l1.86 1.41a7.3 7.3 0 0 0 0 1.35l-1.86 1.41c-.4.3-.51.86-.26 1.3l1.87 3.23c.25.44.79.62 1.25.42l2.15-.91c.37.26.76.49 1.17.68l.29 2.31c.06.5.49.88.99.88h3.73c.5 0 .93-.38.99-.88l.29-2.31c.41-.19.8-.42 1.17-.68l2.15.91c.46.2 1 .02 1.25-.42l1.87-3.23c.25-.44.14-.99-.26-1.3l-1.86-1.41c.03-.23.04-.45.04-.68m-7.46 3.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5"

            >
              Settings
            </div>

          <!-- Fullscreen button -->
          <div class="group relative inline-block">
            <button
              id="fullscreen-button"
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <!-- Enter fullscreen icon -->
              <svg
                id="enter-fullscreen-icon"
                class="size-7"
                viewBox="0 0 24 24"
              >
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

              </svg>

              <!-- Exit fullscreen icon -->
              <svg
                id="exit-fullscreen-icon"
                class="hidden size-7"
                viewBox="0 0 24 24"
              >
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

            <div
              class="pointer-events-none absolute top-full right-0 block translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Enter fullscreen
            </div>
          </div>
        </div>
      </nav>

      <!-- Logos -->
      <div class="flex w-full justify-center pt-0.5">
        <img
          src="/src/assets/logo-purple.svg"
          class="h-auto w-55 dark:hidden"
          alt="Logo"
        />
        <img
          src="/src/assets/logo-white.svg"
          class="hidden h-auto w-55 dark:block"
          alt="Logo"
        />
      </div>

      <!-- Simulation options -->
      <div class="w-full px-6 pt-15 text-center">
        <!-- Text -->
        <p class="text-lg">Select a simulation...</p>

        <!-- Links -->
        <div class="mt-6 flex justify-center gap-10">
          <a
            href="./index.html"
            class="flex h-35 w-55 flex-col items-center justify-center gap-3 rounded-md bg-white font-semibold outline-1 hover:bg-zinc-100 active:bg-zinc-200 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:active:bg-zinc-700"
          >
            <svg class="size-6" viewBox="0 -960 960 960">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

            Solar System
          </a>

          <a
            href="./index.html"
            class="flex h-35 w-55 flex-col items-center justify-center gap-3 rounded-md bg-white font-semibold outline-1 hover:bg-zinc-100 active:bg-zinc-200 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:active:bg-zinc-700"
          >
            <svg class="size-6" viewBox="0 -960 960 960">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path

        </div>
      </div>
    </div>
  </body>
</html>
