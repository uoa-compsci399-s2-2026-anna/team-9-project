{% from "components/container.html" import container %}

<div
  id="loader"
  class="pointer-events-none invisible fixed inset-0 z-50 flex items-center justify-center"
>
  {% call container() %}
    <div
      class="flex aspect-square flex-col items-center justify-center gap-6 p-8"
    >
      <svg
        class="fill-primary size-16"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"
        >
          <animateTransform
            attributeName="transform"
            type="rotate"
            dur="0.75s"
            values="0 12 12;360 12 12"
            repeatCount="indefinite"
          />
        </path>
      </svg>
      <div>
        <p id="loader-text">Loading undefined</p>
        <p id="loader-subtext" class="text-secondary"></p>
      </div>
    </div>
  {% endcall %}
</div>
