{%
  macro settings_option(
    label_text,
    select_id,
    initial_selected,
    options,
    on_change_event_name=None
  )
%}
  <label
    class="flex items-center"
    data-settings-option
    data-on-change-event-name="{{ on_change_event_name }}"
  >
    <span class="text-secondary w-full">{{ label_text }}</span>
    <select
      id="{{ select_id }}"
      class="w-full min-w-0 truncate"
      data-settings-select
    >
      {% for option in options %}
        <option
          value="{{ option.value }}"
          {{ "selected" if option.value == initial_selected }}
        >
          {{ option.label }}
        </option>
      {% endfor %}
    </select>
  </label>
{% endmacro %}
