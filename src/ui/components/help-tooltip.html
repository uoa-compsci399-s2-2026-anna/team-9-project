{%
  macro help_tooltip(
    auto_placement=true,
    placement="top",
    prioritise_order=false
  )
%}
  <div
    role="tooltip"
    data-help-tooltip
    class="pointer-events-none invisible absolute top-0 left-0 isolate z-50 w-80"
    data-placement="{{ placement }}"
    data-auto-placement="{{ auto_placement | tojson }}"
    data-prioritise-order="{{ prioritise_order | tojson }}"
  >
    <!-- Arrow (for outline); z-0 -->
    <div
      data-tooltip-arrow-outline
      class="outlined-light control absolute z-0 size-5 min-h-0 rotate-45 rounded-none"
    ></div>

    <!-- Arrow (for fill colour); z-20 -->
    <div
      data-tooltip-arrow-fill
      class="control absolute z-20 size-5 min-h-0 rotate-45 rounded-none"
    ></div>

    <!-- Container (for background); z-10 -->
    <div class="control bordered-light relative z-10 max-w-80 p-2">
      <p class="invisible text-base">{{ caller() }}</p>
      <br />
      <p class="invisible text-sm italic">Click anywhere to continue...</p>
    </div>

    <!-- Text; z-30 -->
    <div
      class="text-primary control absolute top-0 left-0 z-30 max-w-80 border-none bg-transparent p-2 text-base"
    >
      <p class="z-50">{{ caller() }}</p>
      <br />
      <p class="text-secondary text-sm italic">Click to continue...</p>
    </div>
  </div>
{% endmacro %}
