<div class="flex min-h-0 flex-1 items-end gap-4 px-6 pt-6">
  <!-- Left sidebar -->
  <div class="flex h-full min-h-0 w-48 flex-col gap-2">
    <div class="flex-1"></div>
    <!-- Objects side panel -->
    <div
      class="relative z-10 flex min-h-0 flex-col rounded-md bg-white p-2 outline-1 dark:bg-black dark:outline-zinc-500"
    >
      <!-- "Objects" header and hide panel button -->
      <button id="objects-button" class="flex w-full items-center font-bold">
        <span class="flex-1 text-left">Objects</span>

        <!-- Objects show icon -->
        <svg id="objects-show-icon" class="size-7" viewBox="0 0 24 24">
          <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
          <path
            d="M11 13H6q-.425 0-.712-.288T5 12t.288-.712T6 11h5V6q0-.425.288-.712T12 5t.713.288T13 6v5h5q.425 0 .713.288T19 12t-.288.713T18 13h-5v5q0 .425-.288.713T12 19t-.712-.288T11 18z"
          />
        </svg>

        <!-- Objects hide icon -->
        <svg id="objects-hide-icon" class="hidden size-7" viewBox="0 0 24 24">
          <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
          <path
            d="M6 13q-.425 0-.712-.288T5 12t.288-.712T6 11h12q.425 0 .713.288T19 12t-.288.713T18 13z"
          />
        </svg>
      </button>

      <!-- Objects controls -->
      <div
        id="objects"
        class="grid grid-cols-1 grid-rows-[0fr] overflow-hidden transition-[grid-template-rows] duration-300 ease-in-out"
      >
        <div class="flex flex-col overflow-hidden">
          <div class="min-h-0 flex-1 overflow-y-auto">
            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Mercury</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Venus</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Earth</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Mars</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Jupiter</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Saturn</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Uranus</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" checked />
              <span class="flex-1">Neptune</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" />
              <span class="flex-1">Pluto</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" />
              <span class="flex-1">1P/Halley</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" />
              <span class="flex-1">3I/ATLAS</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- View settings side panel -->
    <div
      class="relative z-10 shrink-0 rounded-md bg-white p-2 outline-1 dark:bg-black dark:outline-zinc-500"
    >
      <!-- "View settings" header and hide panel button -->
      <button
        id="view-settings-button"
        class="flex w-full items-center font-bold"
      >
        <span class="flex-1 text-left">View settings</span>

        <!-- View settings show icon -->
        <svg id="view-settings-show-icon" class="size-7" viewBox="0 0 24 24">
          <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
          <path
            d="M11 13H6q-.425 0-.712-.288T5 12t.288-.712T6 11h5V6q0-.425.288-.712T12 5t.713.288T13 6v5h5q.425 0 .713.288T19 12t-.288.713T18 13h-5v5q0 .425-.288.713T12 19t-.712-.288T11 18z"
          />
        </svg>

        <!-- View settings hide icon -->
        <svg
          id="view-settings-hide-icon"
          class="hidden size-7"
          viewBox="0 0 24 24"
        >
          <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
          <path
            d="M6 13q-.425 0-.712-.288T5 12t.288-.712T6 11h12q.425 0 .713.288T19 12t-.288.713T18 13z"
          />
        </svg>
      </button>

      <!-- View settings controls -->
      <div
        id="view-settings"
        class="grid grid-cols-1 grid-rows-[0fr] overflow-hidden transition-[grid-template-rows] duration-300 ease-in-out"
      >
        <div id="view-settings-toggles" class="flex flex-col overflow-hidden">
          <div class="mt-3">
            <label class="flex items-center gap-2">
              <input type="checkbox" data-toggle="habitable-zone" />
              <span>Habitable zone</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" data-toggle="orbits" />
              <span>Orbits</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" data-toggle="reference-grid" />
              <span>Reference grid</span>
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" data-toggle="labels" />
              <span>Labels</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Reset view button -->
  <button
    id="reset-view"
    class="relative z-10 flex items-center gap-3 rounded-md bg-white p-2 outline-1 hover:bg-zinc-100 hover:outline-zinc-900 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
  >
    Reset view
  </button>

  <!-- Compare to solar system button -->
  <button
    class="relative z-10 flex items-center gap-3 self-end rounded-md bg-white p-2 outline-1 hover:bg-zinc-100 hover:outline-zinc-900 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
  >
    Compare to Solar System
  </button>
</div>
