{%
  macro text_button(
    button_text,
    button_id=None,
    on_click_event_name=None
  )
%}
  <div
    data-button-type
    data-on-click-event-name="{{ on_click_event_name }}"
    class="z-10"
  >
    <button
      id="{{ button_id }}"
      class="control px-2 hover:bg-zinc-100 dark:hover:bg-zinc-900"
      data-button
    >
      {{ button_text }}
    </button>
  </div>
{% endmacro %}
