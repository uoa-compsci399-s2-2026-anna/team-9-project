{%
  macro text_button(
    button_text,
    button_id=None,
    on_click_events=[],
    button_styling=None
  )
%}
  <div
    data-button-type
    data-on-click-events="{{ on_click_events | tojson | forceescape }}"
    class="z-10"
  >
    <button
      id="{{ button_id }}"
      class="{{ button_styling }} control bordered clickable"
      data-button
    >
      {{ button_text }}
    </button>
  </div>
{% endmacro %}
