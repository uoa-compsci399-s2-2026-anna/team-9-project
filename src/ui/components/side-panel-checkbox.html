{%
  macro side_panel_checkbox(
    input_id,
    is_checked_initially,
    label_text,
    data_attributes={},
    toggle_event=None,
    parent_toggle_event=None,
    is_disabled_initially=false
  )
%}
  <label
    class="{{ ml-3 if parent_toggle_event }} flex items-center gap-2"
    data-side-panel-checkbox
    data-toggle-event="{{ toggle_event }}"
    data-parent-toggle-event="{{ parent_toggle_event }}"
  >
    <input
      type="checkbox"
      id="{{ input_id }}"
      {% for name, value in data_attributes.items() %}
        data-{{ name }}="{{ value }}"
      {% endfor %}
      {{ "checked" if is_checked_initially }}
      {{ "disabled" if is_disabled_initially }}
    />
    <span class="min-w-0 flex-1 wrap-break-word">{{ label_text }}</span>

    {{ caller() }}
  </label>
{% endmacro %}
