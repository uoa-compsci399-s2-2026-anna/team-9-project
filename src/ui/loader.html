<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading OPIS...</title>
  <style>
    body {
      background-color: black;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      /* Removes default browser spacing */
    }

    #loader {
      display: grid;
      place-items: center;
    }

    #loader>svg {
      width: 10vh;
      height: 10vh;
    }
  </style>
</head>

<body>
  <!-- Spinner SVG taken from https://magecdn.com/tools/svg-loaders/180-ring/ under MIT license -->
  <div id="loader">
    <svg fill="hsl(0, 0%, 100%)" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z">
        <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12"
          repeatCount="indefinite" />
      </path>
    </svg>
    <h2>
      Preparing OPIS...
    </h2>
  </div>
</body>

</html>
