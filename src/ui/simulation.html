{% extends "base.html" %}

<!-- Page title -->
{% block title %}
  {{ current_system.name }}
  Viewer
{% endblock %}

<!-- System dropdown reference -->
{% block system_name %}
  {{ current_system.name }}
{% endblock %}

{% block object_num %}
  Placeholder
{% endblock %}

<!-- Simulation content-->
{% block content %}
  <canvas
    id="simulation-canvas"
    data-current-system="{{ current_system.name }}"
    class="pointer-events-auto absolute inset-0 z-0 h-full w-full"
  ></canvas>
{% endblock %}

<!-- Scripts block -->
{% block scripts %}
  <script
    type="module"
    src="/src/events/triggers/sharedTriggers.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/events/triggers/settingsTriggers.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/shared/settingsManager.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/ui/settings.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/events/triggers/simulationTriggers.js"
    defer
  ></script>
  <script
    type="module"
    src="/src/rendering/simulationManager.js"
    defer
  ></script>
  <script 
    type="module" 
    src="/src/ui/toolbar.js" 
    defer
  ></script>
  <script 
    type="module" 
    src="/src/ui/simulationControls.js" 
    defer
  ></script>
{% endblock %}
