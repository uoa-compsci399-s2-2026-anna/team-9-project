<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unable to launch...</title>
    <!-- Relative path due to this being loaded before the webserver starts -->
    <link href="../../dist/output.css" rel="stylesheet" />
    <script>
      const query = window.location.search;
      const urlParams = new URLSearchParams(query);
      const darkModeQuery = urlParams.get("darkmode");

      if (darkModeQuery === "true") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else if (darkModeQuery === "false") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>

  <body class="overflow-hidden select-none">
    <div
      class="text-primary flex h-screen w-screen items-center justify-center dark:bg-black"
    >
      <div class="grid place-items-center gap-y-10">
        <!-- Spinner SVG taken from https://magecdn.com/tools/svg-loaders/180-ring/ under MIT license -->
        <h1 class="text-4xl">Uh oh! Something has gone wrong...</h1>
        <h2 class="text-2xl">Please try launching OPIS again</h2>
      </div>
    </div>
  </body>
</html>
