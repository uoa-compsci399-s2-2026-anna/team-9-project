<!doctype html>
<html
  lang="en"
  data-theme="{{ 'dark' if settings.darkMode else 'light' }}"
  class="scheme-light dark:scheme-dark {{ 'font-accessible' if settings.font == 'OpenDyslexic' }}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/output.css" rel="stylesheet" />
    <title>{% block title %}{% endblock %}</title>
  </head>

  <body>
    <div
      class="flex h-screen flex-col bg-white bg-cover bg-center fill-zinc-800 text-zinc-800 select-none dark:bg-black dark:fill-purple-100 dark:text-purple-100"
    >
      <div class="relative flex min-h-0 flex-1 flex-col">
        <!-- COMPONENT: Navigation bar -->
        {% if navigation_bar %}
          {% include "components/navigation-bar.html" %}
        {% endif %}

        <!-- COMPONENT: Content -->
        {% block content %}{% endblock %}
      </div>

      <!-- COMPONENT: Settings overlay -->
      {% if settings_overlay %}
        {% include "components/settings-overlay.html" %}
      {% endif %}
    </div>

    <!--
    Import map for Three.js generated with JSPM Generator. See https://threejs.org/manual/#en/installation
    Edit here: https://generator.jspm.io/#U2VhYGBkDM0rySzJSU1hKMkoSk11MNAztDDVMwQALPhzdxwA
  	-->
    <script type="importmap">
      {
        "imports": {
          "three": "https://ga.jspm.io/npm:three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <!-- COMPONENT: Scripts block -->
    {% block scripts %}{% endblock %}
  </body>
</html>
