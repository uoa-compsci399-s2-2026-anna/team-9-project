<!doctype html>
<html
  lang="en"
  data-theme="{{ 'dark' if settings.darkMode else 'light' }}"
  data-text-size="{{ settings.textSize or 'Default' }}"
  class="{{ 'font-accessible' if settings.font == 'OpenDyslexic' }} scheme-light dark:scheme-dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/output.css" rel="stylesheet" />
    <link
      href="/src/flatpickr/light.css"
      rel="stylesheet"
      id="flatpickr-light-theme"
      {% if settings.darkMode %}disabled{% endif %}
    />
    <link
      href="/src/flatpickr/dark.css"
      rel="stylesheet"
      id="flatpickr-dark-theme"
      {% if not settings.darkMode %}disabled{% endif %}
    />
    <title>{% block title %}{% endblock %}</title>
  </head>

  <body class="overflow-hidden select-none">
    <div
      class="text-primary fill-primary flex h-screen flex-col bg-white p-5 dark:bg-black"
    >
      <div class="relative flex min-h-0 flex-1 flex-col gap-5">
        <!-- COMPONENT: Content -->
        {% block content %}{% endblock %}
      </div>

      <!-- COMPONENT: Settings overlay -->
      {% if settings_overlay %}
        {% include "components/settings-overlay.html" %}
        {% include "components/confirm-reset-settings-overlay.html" %}
      {% endif %}
    </div>

    <!--
    Import map for Three.js generated with JSPM Generator. See https://threejs.org/manual/#en/installation
    Edit here: https://generator.jspm.io/#U2VhYGBkDM0rySzJSU1hKMkoSk11MNAztDDVMwQALPhzdxwA
  	-->
    <script type="importmap">
      {
        "imports": {
          "three": "https://ga.jspm.io/npm:three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
          "luxon": "https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/es6/luxon.js",
          "three.meshline": "https://ga.jspm.io/npm:meshline@3.3.1/dist/index.js"
        }
      }
    </script>

    {% include "components/loader.html" %}

    <!-- COMPONENT: Scripts block -->
    {% block scripts %}{% endblock %}
    <script
      type="module"
      src="/src/controllers/sharedEventController.js"
      defer
    ></script>
  </body>
</html>
