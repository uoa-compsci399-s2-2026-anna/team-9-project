<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../dist/output.css" rel="stylesheet" />
    <title>Orbit Viewer</title>
  </head>
  <body>
    <div
      class="flex h-screen flex-col bg-white bg-[url(../src/assets/background-placeholder-inverted.png)] bg-cover bg-center fill-zinc-900 text-zinc-900 dark:bg-zinc-900 dark:bg-[url(../src/assets/background-placeholder.png)] dark:fill-white dark:text-white"
    >
      <!-- Navigation bar -->
      <nav class="flex flex-wrap items-center justify-between p-6">
        <!-- System information -->
        <button
          class="items-center rounded-md p-2 text-left hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
        >
          <hgroup>
            <h1 class="text-3xl font-bold">Solar System</h1>
            <p class="text-s italic dark:text-zinc-400">8 planets</p>
          </hgroup>
        </button>

        <div class="grow"></div>

        <div class="flex gap-4">
          <!-- Help button -->
          <div class="group relative inline-block">
            <button
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M12.838 17.638q.362-.363.362-.888t-.362-.888t-.888-.362t-.887.363t-.363.887t.363.888t.887.362t.888-.363M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m.1-14.3q.625 0 1.088.4t.462 1q0 .55-.337.975t-.763.8q-.575.5-1.012 1.1t-.438 1.35q0 .35.263.588t.612.237q.375 0 .638-.25t.337-.625q.1-.525.45-.937t.75-.788q.575-.55.988-1.2t.412-1.45q0-1.275-1.037-2.087T12.1 6q-.95 0-1.812.4T8.975 7.625q-.175.3-.112.638t.337.512q.35.2.725.125t.625-.425q.275-.375.688-.575t.862-.2"
                />
              </svg>
            </button>

            <!-- Tooltip -->
            <div
              class="absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Help
            </div>
          </div>

          <!-- Light/dark mode button -->
          <div class="group relative inline-block">
            <button
              id="dark-mode-toggle-button"
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M14 22q-2.075 0-3.9-.788t-3.175-2.137T4.788 15.9T4 12t.788-3.9t2.137-3.175T10.1 2.788T14 2q.875 0 1.75.175t1.675.525q.3.125.45.387t.15.538q0 .225-.088.425t-.287.35q-1.75 1.375-2.7 3.375T14 12q0 2.25.925 4.25t2.7 3.35q.2.15.288.363T18 20.4q0 .275-.15.538t-.45.387q-.8.35-1.662.513T14 22"
                />
              </svg>
            </button>

            <script>
              const html = document.documentElement;
              const button = document.querySelector("#dark-mode-toggle-button");

              button.addEventListener("click", () => {
                const isDark = html.getAttribute("data-theme") === "dark";

                html.setAttribute("data-theme", isDark ? "light" : "dark");
              });
            </script>

            <!-- Tooltip -->
            <div
              class="absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              View in dark mode
            </div>
          </div>

          <!-- Settings button -->
          <!-- Light/dark mode button -->
          <div class="group relative inline-block">
            <button
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M19.5 12c0-.23-.01-.45-.03-.68l1.86-1.41c.4-.3.51-.86.26-1.3l-1.87-3.23a.987.987 0 0 0-1.25-.42l-2.15.91c-.37-.26-.76-.49-1.17-.68l-.29-2.31c-.06-.5-.49-.88-.99-.88h-3.73c-.51 0-.94.38-1 .88l-.29 2.31c-.41.19-.8.42-1.17.68l-2.15-.91c-.46-.2-1-.02-1.25.42L2.41 8.62c-.25.44-.14.99.26 1.3l1.86 1.41a7.3 7.3 0 0 0 0 1.35l-1.86 1.41c-.4.3-.51.86-.26 1.3l1.87 3.23c.25.44.79.62 1.25.42l2.15-.91c.37.26.76.49 1.17.68l.29 2.31c.06.5.49.88.99.88h3.73c.5 0 .93-.38.99-.88l.29-2.31c.41-.19.8-.42 1.17-.68l2.15.91c.46.2 1 .02 1.25-.42l1.87-3.23c.25-.44.14-.99-.26-1.3l-1.86-1.41c.03-.23.04-.45.04-.68m-7.46 3.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5"
                />
              </svg>
            </button>

            <!-- Tooltip -->
            <div
              class="absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Settings
            </div>
          </div>

          <!-- Fullscreen button -->
          <div class="group relative inline-block">
            <button
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M6 14c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h3c.55 0 1-.45 1-1s-.45-1-1-1H7v-2c0-.55-.45-1-1-1m0-4c.55 0 1-.45 1-1V7h2c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1m11 7h-2c-.55 0-1 .45-1 1s.45 1 1 1h3c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1s-1 .45-1 1zM14 6c0 .55.45 1 1 1h2v2c0 .55.45 1 1 1s1-.45 1-1V6c0-.55-.45-1-1-1h-3c-.55 0-1 .45-1 1"
                />
              </svg>
            </button>

            <!-- Tooltip -->
            <div
              class="absolute top-full right-0 block translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Enter fullscreen
            </div>
          </div>
        </div>
      </nav>

      <div class="flex flex-1 items-center">
        <!-- View settings side panel -->
        <div
          class="rounded-md bg-white outline-1 dark:bg-black dark:outline-zinc-500"
        >
          <!-- "View settings" header and hide panel button -->
          <span class="flex items-center pt-3 pr-3 pl-6 font-bold">
            <div class="flex-1">View settings</div>
            <button
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="m10.8 12l3.9 3.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-4.6-4.6q-.15-.15-.212-.325T8.425 12t.063-.375t.212-.325l4.6-4.6q.275-.275.7-.275t.7.275t.275.7t-.275.7z"
                />
              </svg>
            </button>
          </span>

          <!-- View settings controls -->
          <div class="flex flex-col px-6 pb-6">
            <span>
              <input type="checkbox" /><label class="px-3">Show orbits</label>
            </span>
            <span>
              <input type="checkbox" /><label class="px-3">Show ecliptic</label>
            </span>
            <span>
              <input type="checkbox" /><label class="px-3">Show labels</label>
            </span>
          </div>
        </div>
      </div>

      <!-- Bottom controls -->
      <div
        class="bg-linear-to-t from-white via-white via-80% to-transparent px-6 pt-12 pb-6 dark:from-black dark:via-black dark:via-80%"
      >
        <div
          class="flex flex-col items-center gap-4 lg:grid lg:w-full lg:grid-cols-3"
        >
          <!-- Simulation timestamp -->
          <div class="justify-self-start">
            <button
              class="flex items-center gap-3 rounded-md p-2 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M17 2c-.55 0-1 .45-1 1v1H8V3c0-.55-.45-1-1-1s-1 .45-1 1v1H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-1V3c0-.55-.45-1-1-1m2 18H5V10h14zm-8-7c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 4c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1"
                />
              </svg>
              <div class="text-left">
                <p class="text-lg">6 August 2026 15:45 NZT</p>
                <p class="text-s italic dark:text-zinc-400">32 days from now</p>
              </div>
            </button>
          </div>

          <!-- Playback controls -->
          <div class="flex flex-wrap items-start gap-1 justify-self-center">
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1m3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64"
                />
              </svg>
            </button>
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.69L9.54 5.98A.998.998 0 0 0 8 6.82"
                />
              </svg>
            </button>
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="m7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82M16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1"
                />
              </svg>
            </button>
          </div>

          <!-- Simulation speed adjuster -->
          <div class="flex items-center justify-self-end">
            <label class="pr-3">speed</label>
            <input
              type="text"
              class="mr-3 w-18 rounded-md pl-1 outline-1 outline-zinc-900 dark:outline-zinc-500"
              value="20"
            />

            <p class="pr-3">d/s</p>

            <div class="px-3">
              <input
                class="w-full accent-zinc-900 dark:accent-white"
                type="range"
                value="300"
                min="0"
                max="1000"
                oninput=""
              />

              <div class="-mt-2 flex w-full justify-between">
                <span class="text-sm">1 d/s</span>
                <span class="text-sm">1 y/s</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
