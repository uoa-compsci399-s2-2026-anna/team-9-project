<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../dist/output.css" rel="stylesheet" />
    <title>Orbit Viewer</title>
  </head>
  <body>
    <div
      class="flex h-screen flex-col bg-white bg-[url(../src/assets/background-placeholder-inverted.png)] bg-cover fill-zinc-900 p-6 text-zinc-900 dark:bg-zinc-900 dark:bg-[url(../src/assets/background-placeholder.png)] dark:fill-white dark:text-white"
    >
      <!-- Navigation bar -->
      <nav class="flex flex-wrap items-center justify-between">
        <!-- System information -->
        <hgroup class="grow items-center">
          <h1 class="text-3xl font-bold">Solar System</h1>
          <p>8 planets</p>
        </hgroup>

        <div class="flex gap-4">
          <!-- Fullscreen button -->
          <button
            class="rounded-md p-1 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900"
          >
            <svg class="size-7" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="M6 14c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h3c.55 0 1-.45 1-1s-.45-1-1-1H7v-2c0-.55-.45-1-1-1m0-4c.55 0 1-.45 1-1V7h2c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1m11 7h-2c-.55 0-1 .45-1 1s.45 1 1 1h3c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1s-1 .45-1 1zM14 6c0 .55.45 1 1 1h2v2c0 .55.45 1 1 1s1-.45 1-1V6c0-.55-.45-1-1-1h-3c-.55 0-1 .45-1 1"
              />
            </svg>
          </button>

          <!-- Settings button -->
          <button
            class="rounded-md p-1 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900"
          >
            <svg class="size-7" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="M19.5 12c0-.23-.01-.45-.03-.68l1.86-1.41c.4-.3.51-.86.26-1.3l-1.87-3.23a.987.987 0 0 0-1.25-.42l-2.15.91c-.37-.26-.76-.49-1.17-.68l-.29-2.31c-.06-.5-.49-.88-.99-.88h-3.73c-.51 0-.94.38-1 .88l-.29 2.31c-.41.19-.8.42-1.17.68l-2.15-.91c-.46-.2-1-.02-1.25.42L2.41 8.62c-.25.44-.14.99.26 1.3l1.86 1.41a7.3 7.3 0 0 0 0 1.35l-1.86 1.41c-.4.3-.51.86-.26 1.3l1.87 3.23c.25.44.79.62 1.25.42l2.15-.91c.37.26.76.49 1.17.68l.29 2.31c.06.5.49.88.99.88h3.73c.5 0 .93-.38.99-.88l.29-2.31c.41-.19.8-.42 1.17-.68l2.15.91c.46.2 1 .02 1.25-.42l1.87-3.23c.25-.44.14-.99-.26-1.3l-1.86-1.41c.03-.23.04-.45.04-.68m-7.46 3.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5"
              />
            </svg>
          </button>
        </div>
      </nav>

      <!-- Simulation (main content; temporary) -->
      <div class="flex flex-1 items-center">Simulation goes here</div>

      <!-- Bottom controls -->
      <div
        class="flex flex-col items-center gap-4 md:grid md:w-full md:grid-cols-3"
      >
        <!-- Playback controls -->
        <div class="flex flex-wrap items-start gap-1 justify-self-start">
          <button
            class="rounded-md p-1 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900"
          >
            <svg class="size-10" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1m3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64"
              />
            </svg>
          </button>
          <button
            class="rounded-md p-1 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900"
          >
            <svg class="size-10" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.69L9.54 5.98A.998.998 0 0 0 8 6.82"
              />
            </svg>
          </button>
          <button
            class="rounded-md p-1 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900"
          >
            <svg class="size-10" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="m7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82M16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1"
              />
            </svg>
          </button>
        </div>

        <!-- Simulation timestamp -->
        <div class="justify-self-center">
          <button
            class="flex gap-3 rounded-md p-2 transition-colors duration-100 hover:bg-zinc-100 dark:hover:bg-white dark:hover:fill-zinc-900 dark:hover:text-zinc-900"
          >
            <svg class="size-7" viewBox="0 0 24 24">
              <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
              <path
                d="M17 2c-.55 0-1 .45-1 1v1H8V3c0-.55-.45-1-1-1s-1 .45-1 1v1H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-1V3c0-.55-.45-1-1-1m2 18H5V10h14zm-8-7c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 4c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1"
              />
            </svg>
            <p class="text-lg">6 August 2026 15:45 UTC</p>
          </button>
        </div>

        <!-- Simulation speed adjuster -->
        <div class="w-3/4 justify-self-end md:w-1/2">
          <input
            class="w-full accent-zinc-900 dark:accent-white"
            type="range"
            value="300"
            min="0"
            max="1000"
            oninput=""
          />

          <div class="-mt-2 flex w-full justify-between">
            <span class="text-sm">1 d/s</span>
            <span class="text-sm">1 y/s</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
