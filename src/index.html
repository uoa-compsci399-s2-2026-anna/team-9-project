<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../dist/output.css" rel="stylesheet" />
    <title>Orbit Viewer</title>
  </head>
  <body>
    <div

    >
      <!-- Navigation bar -->
      <nav class="z-30 flex flex-wrap items-start justify-between p-6">
        <!-- System information -->
        <button
          id="system-information-button"
          class="items-center rounded-md p-2 text-left opacity-100 transition-opacity duration-200 ease-in-out hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
        >
          <hgroup>
            <span class="flex items-center">
              <h1 class="pr-2 text-3xl font-bold">Solar System</h1>

              <!-- Dropdown chevron -->
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

                  d="M11.475 14.475L7.85 10.85q-.075-.075-.112-.162T7.7 10.5q0-.2.138-.35T8.2 10h7.6q.225 0 .363.15t.137.35q0 .05-.15.35l-3.625 3.625q-.125.125-.25.175T12 14.7t-.275-.05t-.25-.175"
                />
              </svg>
            </span>
            <p class="text-s italic dark:text-zinc-400">8 planets</p>
          </hgroup>
        </button>

        <div class="grow"></div>

        <!-- Controls on RHS -->
        <div class="flex gap-4">
          <!-- Help button -->
          <div class="group relative inline-flex">
            <button
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >

                  d="M12.838 17.638q.362-.363.362-.888t-.362-.888t-.888-.362t-.887.363t-.363.887t.363.888t.887.362t.888-.363M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m.1-14.3q.625 0 1.088.4t.462 1q0 .55-.337.975t-.763.8q-.575.5-1.012 1.1t-.438 1.35q0 .35.263.588t.612.237q.375 0 .638-.25t.337-.625q.1-.525.45-.937t.75-.788q.575-.55.988-1.2t.412-1.45q0-1.275-1.037-2.087T12.1 6q-.95 0-1.812.4T8.975 7.625q-.175.3-.112.638t.337.512q.35.2.725.125t.625-.425q.275-.375.688-.575t.862-.2"
                />
              </svg>
            </button>

            <!-- Tooltip -->
            <div
              class="pointer-events-none absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Help
            </div>
          </div>

          <!-- Light/dark mode button -->
          <div class="group relative inline-flex">

                />
              </svg>
            </button>

            <!-- Tooltip -->
            <div
              class="pointer-events-none absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              View in dark mode
            </div>
          </div>

          <!-- Settings button -->
          <div class="group relative inline-flex">
            <button
              id="settings-button"
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M19.5 12c0-.23-.01-.45-.03-.68l1.86-1.41c.4-.3.51-.86.26-1.3l-1.87-3.23a.987.987 0 0 0-1.25-.42l-2.15.91c-.37-.26-.76-.49-1.17-.68l-.29-2.31c-.06-.5-.49-.88-.99-.88h-3.73c-.51 0-.94.38-1 .88l-.29 2.31c-.41.19-.8.42-1.17.68l-2.15-.91c-.46-.2-1-.02-1.25.42L2.41 8.62c-.25.44-.14.99.26 1.3l1.86 1.41a7.3 7.3 0 0 0 0 1.35l-1.86 1.41c-.4.3-.51.86-.26 1.3l1.87 3.23c.25.44.79.62 1.25.42l2.15-.91c.37.26.76.49 1.17.68l.29 2.31c.06.5.49.88.99.88h3.73c.5 0 .93-.38.99-.88l.29-2.31c.41-.19.8-.42 1.17-.68l2.15.91c.46.2 1 .02 1.25-.42l1.87-3.23c.25-.44.14-.99-.26-1.3l-1.86-1.41c.03-.23.04-.45.04-.68m-7.46 3.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5"
                />

            <!-- Tooltip -->
            <div
              class="pointer-events-none absolute top-full left-1/2 block -translate-x-1/2 translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Settings
            </div>
          </div>

          <!-- Fullscreen button -->
          <div class="group relative inline-flex">
            <button
              id="fullscreen-button"
              class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <!-- Enter fullscreen icon -->
              <svg
                id="enter-fullscreen-icon"
                class="size-7"
                viewBox="0 0 24 24"
              >
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path

                />

              <!-- Exit fullscreen icon -->

                class="hidden size-7"
                viewBox="0 0 24 24"

                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

                  d="M6 18H4q-.425 0-.712-.288T3 17t.288-.712T4 16h3q.425 0 .713.288T8 17v3q0 .425-.288.713T7 21t-.712-.288T6 20zm12 0v2q0 .425-.288.713T17 21t-.712-.288T16 20v-3q0-.425.288-.712T17 16h3q.425 0 .713.288T21 17t-.288.713T20 18zM6 6V4q0-.425.288-.712T7 3t.713.288T8 4v3q0 .425-.288.713T7 8H4q-.425 0-.712-.288T3 7t.288-.712T4 6zm12 0h2q.425 0 .713.288T21 7t-.288.713T20 8h-3q-.425 0-.712-.288T16 7V4q0-.425.288-.712T17 3t.713.288T18 4z"
                />

            </button>

            <!-- Tooltip -->
            <div
              class="pointer-events-none absolute top-full right-0 block translate-y-1/4 rounded-md bg-zinc-100 p-1 text-center whitespace-nowrap opacity-0 outline-1 outline-zinc-900 group-hover:opacity-100 dark:bg-zinc-900 dark:outline-1 dark:outline-zinc-500"
            >
              Enter fullscreen

          </div>
        </div>
      </nav>

      <div class="flex flex-1 items-end gap-4 p-6">
        <!-- View settings side panel -->
        <div
          class="rounded-md bg-white outline-1 dark:bg-black dark:outline-zinc-500"
        >
          <!-- "View settings" header and hide panel button -->
          <span class="flex items-center pt-3 pr-3 pl-6 font-bold">
            <div class="flex-1">View settings</div>
            <button
              class="rounded-md p-1 outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="m10.8 12l3.9 3.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-4.6-4.6q-.15-.15-.212-.325T8.425 12t.063-.375t.212-.325l4.6-4.6q.275-.275.7-.275t.7.275t.275.7t-.275.7z"
                />
              </svg>
            </button>
          </span>

          <!-- View settings controls -->
          <div class="flex flex-col px-6 pb-6">
            <span>
              <input type="checkbox" /><label class="px-3"
                >Habitable zone</label
              >
            </span>
            <span>
              <input type="checkbox" /><label class="px-3">Orbits</label>
            </span>
            <span>
              <input type="checkbox" /><label class="px-3"
                >Reference grid</label
              >
            </span>
            <span>
              <input type="checkbox" /><label class="px-3">Labels</label>
            </span>
          </div>
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Compare to solar system button -->
        <button
          class="flex items-center gap-3 self-end rounded-md bg-white p-2 outline-1 hover:bg-zinc-100 hover:outline-zinc-900 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
        >
          Compare to Solar System
        </button>

        <!-- Reset view button -->
        <button
          class="flex items-center gap-3 rounded-md bg-white p-2 outline-1 hover:bg-zinc-100 hover:outline-zinc-900 dark:bg-black dark:outline-zinc-500 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
        >
          Reset view
        </button>
      </div>

      <!-- Bottom controls -->
      <div
        class="bg-linear-to-t from-white via-white via-80% to-transparent px-6 pt-12 pb-6 dark:from-black dark:via-black dark:via-80%"
      >
        <div
          class="flex flex-col items-center gap-4 lg:grid lg:w-full lg:grid-cols-3"
        >
          <!-- Simulation timestamp -->
          <div class="justify-self-start">
            <button
              class="flex items-center gap-3 rounded-md p-2 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-7" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M17 2c-.55 0-1 .45-1 1v1H8V3c0-.55-.45-1-1-1s-1 .45-1 1v1H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-1V3c0-.55-.45-1-1-1m2 18H5V10h14zm-8-7c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 4c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m-4 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1m8 0c0-.55.45-1 1-1s1 .45 1 1s-.45 1-1 1s-1-.45-1-1"
                />
              </svg>
              <div class="text-left">
                <p class="text-lg">6 August 2026 15:45 NZT</p>
                <p class="text-s italic dark:text-zinc-400">32 days from now</p>
              </div>
            </button>
          </div>

          <!-- Playback controls -->
          <div class="flex flex-wrap items-start gap-1 justify-self-center">
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->

                  d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1m3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64"
                />
              </svg>
            </button>
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.69L9.54 5.98A.998.998 0 0 0 8 6.82"
                />
              </svg>
            </button>
            <button
              class="rounded-md p-1 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
            >
              <svg class="size-10" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="m7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82M16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1"
                />
              </svg>
            </button>
          </div>

          <!-- Simulation speed adjuster -->
          <div class="flex items-center justify-self-end">
            <label class="pr-3">speed</label>
            <input
              type="text"
              class="mr-3 w-18 rounded-md pl-1 outline-1 outline-zinc-900 dark:outline-zinc-500"
              value="20"
            />

            <p class="pr-3">d/s</p>

            <div class="px-3">
              <input
                class="w-full accent-zinc-900 dark:accent-white"
                type="range"
                value="300"
                min="0"
                max="1000"
                oninput=""
              />

              <div class="-mt-2 flex w-full justify-between">
                <span class="text-sm">1 d/s</span>
                <span class="text-sm">1 y/s</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings overlay -->
      <div
        id="settings-overlay"
        class="pointer-events-none fixed inset-0 z-40 flex h-full w-full items-center justify-center bg-white/30 opacity-0 backdrop-blur-sm transition-opacity duration-200 ease-in-out dark:bg-zinc-900/30"
      >
        <div
          class="h-full w-full max-w-prose bg-white p-6 shadow-2xl shadow-black/50 dark:bg-zinc-900"
        >
          <div class="flex items-start">
            <h1 class="mb-4 flex-1 text-3xl font-bold">Settings</h1>

            <!-- Close button -->
            <div>
              <button
                id="close-settings-menu-button"
                class="rounded-md p-1 leading-none outline-0 hover:bg-zinc-100 hover:outline-1 hover:outline-zinc-900 dark:hover:bg-zinc-900 dark:hover:outline-zinc-500"
              >
                <svg class="size-7" viewBox="0 0 24 24">
                  <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                  <path
                    d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- General settings -->
          <div class="mb-4 flex flex-col gap-2">
            <h2 class="text-lg font-bold">General</h2>

            <label class="flex">
              <span class="flex-1">Time zone</span>
              <select name="time-zone" class="flex-1">
                <option value="">UTC</option>
                <option value="">NZT</option>
              </select>
            </label>
          </div>

          <!-- Accessibility settings -->
          <div class="mb-4 flex flex-col gap-2">
            <div class="flex items-center gap-2">
              <h2 class="text-lg font-bold">Accessibility</h2>

              <svg class="size-6" viewBox="0 0 24 24">
                <!-- Icon from Google Material Icons by Material Design Authors - https://github.com/material-icons/material-icons/blob/master/LICENSE -->
                <path
                  d="M10.588 5.413Q10 4.825 10 4t.588-1.412T12 2t1.413.588T14 4t-.587 1.413T12 6t-1.412-.587M9 21V9q-1.225-.1-2.475-.275t-2.45-.45q-.425-.1-.687-.475T3.25 7t.525-.625t.85-.1q1.75.375 3.638.55T12 7t3.738-.175t3.637-.55q.45-.1.85.1T20.75 7t-.137.8t-.688.475q-1.2.275-2.45.45T15 9v12q0 .425-.287.713T14 22t-.712-.288T13 21v-5h-2v5q0 .425-.288.713T10 22t-.712-.288T9 21"
                />
              </svg>
            </div>

            <!-- Font selection -->
            <label class="flex">
              <span class="flex-1">Font</span>
              <select name="font" class="flex-1">
                <option value="">Default</option>
                <option value="">OpenDyslexic</option>
              </select>
            </label>

            <!-- Text size -->
            <label class="flex">
              <span class="flex-1">Text size</span>
              <select name="text-size" class="flex-1">
                <option value="">Default</option>
                <option value="">Larger</option>
              </select>
            </label>

            <!-- Orbit lines -->
            <label class="flex">
              <span class="flex-1">Orbit lines</span>
              <select name="" class="flex-1">
                <option value="">Differentiate by colour</option>
                <option value="">Differentiate by stroke</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>

    <script>
      const html = document.documentElement;
      const darkModeToggleButton = document.querySelector(
        "#dark-mode-toggle-button",
      );
      const darkModeIcon = document.querySelector("#dark-mode-icon");
      const lightModeIcon = document.querySelector("#light-mode-icon");

      /**
       * Updates the icon (SVG) of the dark/light mode toggle button to be the
       * correct icon based on the current theme.
       */
      function updateDarkModeIcon() {
        const isDark = html.getAttribute("data-theme") === "dark";

        if (isDark) {
          lightModeIcon.classList.remove("hidden");
          darkModeIcon.classList.add("hidden");
        } else {
          lightModeIcon.classList.add("hidden");
          darkModeIcon.classList.remove("hidden");
        }
      }

      /**
       * Toggles dark/light mode and updates the icon (SVG) of the dark/light
       * mode toggle button.
       */
      function toggleDarkMode() {
        const isDark = html.getAttribute("data-theme") === "dark";

        html.setAttribute("data-theme", isDark ? "light" : "dark");
        updateDarkModeIcon();
      }

      // Update icons to ensure they are initially shown correctly depending on
      // theme on startup
      updateDarkModeIcon();

      darkModeToggleButton.addEventListener("click", toggleDarkMode);

      const settingsButton = document.querySelector("#settings-button");
      const settingsOverlay = document.querySelector("#settings-overlay");
      const systemInformationButton = document.querySelector(
        "#system-information-button",
      );

      /**
       * Toggles the visibility of the settings menu overlay.
       */
      function toggleSettingsMenu() {
        settingsOverlay.classList.toggle("opacity-0");
        settingsOverlay.classList.toggle("opacity-100");
        settingsOverlay.classList.toggle("pointer-events-none");
        document.body.classList.toggle("settings-menu-open");
      }

      settingsButton.addEventListener("click", toggleSettingsMenu);

      const closeSettingsMenuButton = document.querySelector(
        "#close-settings-menu-button",
      );

      closeSettingsMenuButton.addEventListener("click", toggleSettingsMenu);
      settingsOverlay.addEventListener("click", (e) => {
        // Close settings menu only when the user clicks outside of the main
        // settings menu panel
        if (e.target === e.currentTarget) {
          toggleSettingsMenu();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          // Close settings menu if open and user presses escape
          if (document.body.classList.contains("settings-menu-open")) {
            toggleSettingsMenu();
          }
        }
      });

      const fullscreenButton = document.querySelector("#fullscreen-button");
      const enterFullscreenIcon = document.querySelector(
        "#enter-fullscreen-icon",
      );
      const exitFullscreenIcon = document.querySelector(
        "#exit-fullscreen-icon",
      );

      fullscreenButton.addEventListener("click", () => {
        enterFullscreenIcon.classList.toggle("hidden");
        exitFullscreenIcon.classList.toggle("hidden");

        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          if (html.requestFullscreen) {
            html.requestFullscreen();
          } else if (html.webkitRequestFullscreen) {
            // Safari
            html.webkitRequestFullscreen();
          } else if (html.msRequestFullscreen) {
            // IE11
            html.msRequestFullscreen();
          }
        }
      });
    </script>
  </body>
</html>
